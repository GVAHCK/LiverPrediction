# Configuration for Referral-Budgeted, Sex-Audited Selective Classification
# "Referral-Budgeted, Sex-Audited Selective Classification for Small-Sample Liver Laboratory Data"

experiment:
  name: "liver_selective_classification"
  random_seed: 42
  deterministic: true
  python_version: "3.11.15"

data:
  raw_ilpd_path: "data/raw/indian_liver_patient.csv"
  clean_ilpd_path: "data/processed/ilpd_clean.parquet"
  dedup_ilpd_path: "data/processed/ilpd_dedup.parquet"
  hcv_path: "data/raw/hcvdat0.csv"
  features:
    - "Age"
    - "Total_Bilirubin"
    - "Direct_Bilirubin"
    - "Alkaline_Phosphotase"
    - "Alamine_Aminotransferase"
    - "Aspartate_Aminotransferase"
    - "Total_Protiens"
    - "Albumin"
    - "Albumin_and_Globulin_Ratio"
    - "is_male"
  positive_class: 1
  negative_class: 0

nested_cross_validation:
  outer_folds: 5
  outer_repeats: 3
  inner_folds: 3
  stratification: "sex_and_label"
  grid:
    models:
      - "LogisticRegression"
      - "RandomForest"
      - "HistGradientBoosting"
      - "KNeighborsClassifier"
    imbalance:
      - "none"
      - "class_weight"
      - "ROS"
      - "SMOTENC"
    calibration:
      - "none"
      - "sigmoid"
      - "isotonic"
  target_recall: 0.90
  selection_metric: "auroc_minus_brier"

selective_policy:
  referral_budgets:
    - 0.10
    - 0.20
    - 0.30
  budget_tolerance: 0.02
  min_group_coverage: 0.50
  lambda_penalty: 0.50
  grid:
    a_values: [0.15, 0.20, 0.25, 0.30, 0.35, 0.40]
    b_values: [0.60, 0.65, 0.70, 0.75, 0.80, 0.85]
  baselines:
    - "No_Abstention"
    - "Matched_Random"
    - "Global_Confidence"
    - "Global_Two_Threshold"
    - "Group_Thresholds_lambda0"
    - "Cost_Sensitive_Rejection"

statistics:
  bootstrap_iterations: 2000
  aggregation: "patient_level_repeat_aware"
  confidence_level: 0.95
  multiplicity_control: "holm_bonferroni"
  primary_hypothesis: "Group_Audited_Policy vs Baseline_Global_Confidence at B=0.20"

serving:
  app_port: 5000
  model_bundle: "app/production_model.joblib"
  version: "3.0.0"
  purpose: "RESEARCH_PROTOTYPE_DEMONSTRATION_ONLY"
